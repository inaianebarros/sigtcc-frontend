# Incluído em todo bloco location que usa add_header (add_header de um nível é descartado quando o
# nível interno define o seu). O TLS termina na borda, então não há HSTS aqui.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# style-src 'unsafe-inline': o Emotion (MUI) e o FullCalendar injetam <style> em tempo de execução.
# Scripts só do próprio domínio (sem inline, sem eval); fontes e imagens são empacotadas pelo Vite.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
